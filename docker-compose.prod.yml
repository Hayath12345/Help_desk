# PRODUCTION-STYLE REHEARSAL on a developer machine - an EXAMPLE, not a deployment (Phase 6, G10).
#
# Runs the three production images (web, api, worker) and the one-off migrate image exactly as
# built for AWS, against the local services of docker-compose.yml (postgres, redis, minio, mailpit)
# with a production-style environment: NODE_ENV=production, read-only root file systems, no
# capabilities, non-root users. The strict AWS rules of the configuration check are switched off
# with DEPLOY_PROFILE=rehearsal (plain HTTP, MinIO, SMTP, no TLS to the local services); everything
# else is the production code path. Never use this file, or DEPLOY_PROFILE=rehearsal, on AWS.
#
# Do not run it by hand unless you know what it needs: scripts/smoke-prod.sh creates an isolated
# database, bucket and Redis key prefix (REHEARSAL_*), generates the secrets, builds and starts
# everything, checks it and removes it again:
#
#   docker compose up -d                 # the local services (postgres, redis, minio, mailpit)
#   scripts/smoke-prod.sh                # builds, rehearses, tears down
#
# Host ports (loopback only): web 3100, api 4100, so the development stack on 3000 / 4000 can run
# next to it.

name: loons-rehearsal

x-environment: &environment
  NODE_ENV: production
  DEPLOY_PROFILE: rehearsal
  LOG_LEVEL: info
  APP_VERSION: ${REHEARSAL_VERSION:-rehearsal}
  APP_URL: http://localhost:${REHEARSAL_WEB_PORT:-3100}
  CORS_ORIGINS: http://localhost:${REHEARSAL_WEB_PORT:-3100}
  DATABASE_URL: postgresql://loons:loons@postgres:5432/${REHEARSAL_DB:?run scripts/smoke-prod.sh}
  DATABASE_POOL_SIZE: '5'
  REDIS_URL: redis://redis:6379
  REDIS_KEY_PREFIX: ${REHEARSAL_PREFIX:?run scripts/smoke-prod.sh}
  SOCKET_REDIS_ADAPTER: 'true'
  API_JWT_SECRET: ${API_JWT_SECRET:?run scripts/smoke-prod.sh}
  API_JWT_ISSUER: loons-web
  API_JWT_AUDIENCE: loons-api
  API_TOKEN_TTL_SECONDS: '900'
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run scripts/smoke-prod.sh}
  STAFF_EMAIL_DOMAIN: loonsgroup.com
  # Set on purpose: the rehearsal proves it has no effect in production (no staff password form).
  AUTH_DEV_STAFF_LOGIN: 'true'
  S3_REGION: us-east-1
  S3_BUCKET: ${REHEARSAL_BUCKET:?run scripts/smoke-prod.sh}
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY_ID: loons
  S3_SECRET_ACCESS_KEY: loons-local-secret
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: Loons Support <support@loonsgroup.com>
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMS_PROVIDER: console
  TEAMS_PROVIDER: console

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: 'no'
  networks:
    - infra

services:
  # One-off: apply the committed migrations, then exit. Idempotent.
  migrate:
    <<: *hardening
    image: loons-migrate:rehearsal
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://loons:loons@postgres:5432/${REHEARSAL_DB:?run scripts/smoke-prod.sh}

  # One-off, run after migrate: the production seed (configuration only; NODE_ENV=production never
  # creates demo data).
  seed:
    <<: *hardening
    image: loons-migrate:rehearsal
    profiles: [seed]
    command: ['prisma', 'db', 'seed']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://loons:loons@postgres:5432/${REHEARSAL_DB:?run scripts/smoke-prod.sh}
      STAFF_EMAIL_DOMAIN: loonsgroup.com
      SEED_DEMO_DATA: 'true'
      SEED_ADMIN_EMAIL: ${REHEARSAL_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: Rehearsal Admin

  api:
    <<: *hardening
    image: loons-api:rehearsal
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${REHEARSAL_API_PORT:-4100}:4000'
    environment:
      <<: *environment
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      CORS_ORIGINS: http://localhost:${REHEARSAL_WEB_PORT:-3100}
      TRUST_PROXY: '1'
      REALTIME_SOCKETS_PER_USER: '20'

  worker:
    <<: *hardening
    image: loons-worker:rehearsal
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *environment
      WORKER_SCHEDULERS: 'true'

  web:
    <<: *hardening
    image: loons-web:rehearsal
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the image (browser-facing addresses). REHEARSAL_BUILD lifts the https /
        # non-localhost rule of the web Dockerfile and exists for this rehearsal image only
        # (never for an image that goes to AWS).
        REHEARSAL_BUILD: 'true'
        NEXT_PUBLIC_API_URL: http://localhost:${REHEARSAL_API_PORT:-4100}
        NEXT_PUBLIC_UPLOAD_ORIGIN: http://localhost:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${REHEARSAL_WEB_PORT:-3100}:3000'
    environment:
      NODE_ENV: production
      DEPLOY_PROFILE: rehearsal
      AUTH_URL: http://localhost:${REHEARSAL_WEB_PORT:-3100}
      AUTH_TRUST_HOST: 'true'
      AUTH_SECRET: ${AUTH_SECRET:?run scripts/smoke-prod.sh}
      API_INTERNAL_URL: http://api:4000
      API_JWT_SECRET: ${API_JWT_SECRET:?run scripts/smoke-prod.sh}
      API_JWT_ISSUER: loons-web
      API_JWT_AUDIENCE: loons-api
      API_TOKEN_TTL_SECONDS: '900'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run scripts/smoke-prod.sh}
      STAFF_EMAIL_DOMAIN: loonsgroup.com
      TRUSTED_PROXY_HOPS: '1'
      AUTH_DEV_STAFF_LOGIN: 'true'

# The network of docker-compose.yml (project loons-helpdesk): postgres, redis, minio and mailpit
# resolve by service name.
networks:
  infra:
    external: true
    name: loons-helpdesk_default
