# Local infrastructure for Loons Help Desk.
#   docker compose up -d        start everything
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and wipe all local data
#
# In AWS these are replaced by RDS PostgreSQL, ElastiCache Redis, S3 and SES —
# only environment variables change (see .env.example).
#
# MinIO no longer publishes images to Docker Hub; the official images live on quay.io.

name: loons-helpdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loons
      POSTGRES_PASSWORD: loons
      POSTGRES_DB: loons_helpdesk
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loons -d loons_helpdesk']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: loons
      MINIO_ROOT_PASSWORD: loons-local-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console → http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the attachments bucket (private) and a CORS-friendly policy for pre-signed uploads.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 loons loons-local-secret &&
        mc mb --ignore-existing local/loons-helpdesk-attachments &&
        mc anonymous set none local/loons-helpdesk-attachments &&
        echo 'bucket ready'
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI → http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
