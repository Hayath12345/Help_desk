# Local infrastructure for Loons Help Desk.
#   docker compose up -d        start everything
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and wipe all local data
#
# In AWS these are replaced by RDS PostgreSQL, ElastiCache Redis, S3 and SES —
# only environment variables change (see .env.example).
#
# MinIO no longer publishes images to Docker Hub; the official images live on quay.io.

name: loons-helpdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loons
      POSTGRES_PASSWORD: loons
      POSTGRES_DB: loons_helpdesk
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loons -d loons_helpdesk']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest # MinIO's own images were withdrawn from quay.io/Docker Hub
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: loons
      MINIO_ROOT_PASSWORD: loons-local-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console → http://localhost:9001
    volumes:
      - minio-data:/data

  # One-shot: creates the attachments bucket (private) and a CORS-friendly policy for pre-signed
  # uploads, and expires browser uploads (`attachments/…`) after a day: `complete` copies a checked
  # upload under `files/…` and deletes it, but the pre-signed POST stays valid for 15 minutes, so a
  # re-POST would leave an object nothing references (review RR-SEC-4). The production bucket needs
  # the same lifecycle rule (plus the delete-marker rule for a versioned bucket; see the docs).
  # Idempotent by construction: `mc ilm import` replaces the bucket's whole lifecycle configuration
  # with this fixed document (rule ID expire-browser-uploads) on every run, whatever was there —
  # a disabled or longer rule on the prefix no longer passes for the real one.
  minio-init:
    build: ./deploy/minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 loons loons-local-secret; do sleep 2; done
        mc mb --ignore-existing local/loons-helpdesk-attachments
        mc anonymous set none local/loons-helpdesk-attachments
        mc ilm import local/loons-helpdesk-attachments <<'LIFECYCLE'
        {"Rules":[{"ID":"expire-browser-uploads","Status":"Enabled","Filter":{"Prefix":"attachments/"},"Expiration":{"Days":1},"NoncurrentVersionExpiration":{"NoncurrentDays":1}}]}
        LIFECYCLE
        mc ilm rule ls --json local/loons-helpdesk-attachments
        echo 'bucket ready'
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI → http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
