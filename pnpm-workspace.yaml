packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# Single source of truth for dependency versions (`"dep": "catalog:"` in package.json).
catalog:
  # tooling
  typescript: 6.0.3
  '@types/node': ^24.13.6
  turbo: 2.11.3
  prettier: 3.9.9
  eslint: 9.39.5
  '@eslint/js': ^9.39.5
  typescript-eslint: 8.70.1
  eslint-config-next: 16.3.6
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  tsx: 4.23.15
  dotenv: ^18.0.3
  dotenv-cli: 11.0.0
  vitest: 5.0.1
  '@playwright/test': 1.63.0
  # shared
  zod: 4.6.5
  jose: 6.2.12
  # database
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: ^8.16.3
  '@types/pg': ^8.23.1
  '@node-rs/argon2': 2.2.1
  # api
  fastify: 5.12.5
  fastify-plugin: ^6.0.0
  fastify-type-provider-zod: 7.0.0
  '@fastify/swagger': 9.9.0
  '@fastify/swagger-ui': 6.1.1
  '@fastify/helmet': 13.1.1
  '@fastify/cors': 11.3.0
  '@fastify/rate-limit': 11.2.0
  '@fastify/cookie': 11.1.2
  pino: 10.3.1
  pino-pretty: 13.1.3
  socket.io: 4.8.3
  socket.io-client: 4.8.3
  '@socket.io/redis-adapter': 8.3.0
  bullmq: 6.3.8
  ioredis: 6.0.0
  nodemailer: 10.0.10
  '@types/nodemailer': ^8.0.2
  '@aws-sdk/client-s3': 3.1138.0
  '@aws-sdk/s3-request-presigner': 3.1138.0
  '@aws-sdk/s3-presigned-post': 3.1138.0
  '@aws-sdk/client-sesv2': 3.1138.0
  '@aws-sdk/client-sns': 3.1138.0
  # emails
  '@react-email/components': 1.0.12
  '@react-email/render': ^2.1.0
  # web
  next: 16.3.6
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next-auth: 5.0.0-beta.32
  next-intl: 4.14.6
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tw-animate-css: 1.4.0
  motion: 13.4.1
  '@tanstack/react-query': 5.103.2
  react-hook-form: 7.88.0
  '@hookform/resolvers': 5.9.1
  radix-ui: 1.6.7
  lucide-react: 1.47.0
  class-variance-authority: 0.7.1
  cn: ^0.4.0
  cmdk: ^1.1.1
  sonner: ^2.0.8
  shadcn: 4.21.0

